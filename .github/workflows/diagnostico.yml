name: Diagnóstico OddsPapi

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python diagnostico.py
