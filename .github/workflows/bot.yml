name: Bot ténis ao vivo

on:
  schedule:
    - cron: "17 * * * *"      # de hora a hora; só corre um de cada vez (concurrency)
  workflow_dispatch:

concurrency:
  group: bot-tenis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scouting:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: Correr bot (~5h45)
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_tenis.py --duracao-min=345
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
      - name: Gravar registo de leituras
        if: always()
        run: |
          if [ -f registo_leituras.csv ] && [ -n "$(git status --porcelain registo_leituras.csv)" ]; then
            git config user.name "bot-tenis"
            git config user.email "bot-tenis@users.noreply.github.com"
            git add registo_leituras.csv
            git commit -m "Registo de leituras $(date -u +%F_%H%M)"
            git pull --rebase || true
            git push
          fi
